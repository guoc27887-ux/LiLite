name: Build iOS 18 IPA (error harvest)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build with iOS 18 target
    runs-on: macos-26
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest stable Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          pick=$(ls -d /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app 2>/dev/null | head -1)
          if [ -z "$pick" ]; then pick=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1); fi
          echo "Selected: $pick"
          sudo xcode-select -s "$pick"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $sdk"
          python3 -c "import json,plistlib,sys; s=json.load(open('$sdk/SDKSettings.json')); v=plistlib.load(open('$sdk/System/Library/CoreServices/SystemVersion.plist','rb')); print('SDKSettings Version:', s['Version'], '| ProductVersion:', v['ProductVersion'])"

      - name: Install xtool
        run: |
          brew tap xtool-org/tap
          brew trust xtool-org/tap
          brew install xtool
          xtool --version

      - name: Install native build tools
        run: |
          brew install meson ninja pkg-config
          python3 -m pip install --break-system-packages jinja2

      - name: Build (log to file)
        run: |
          set -o pipefail
          bash Scripts/build-ios18.sh 2>&1 | tee build-ios18.log

      - name: Upload IPA
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: lilite-ios18-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios18-build-log
          path: build-ios18.log
          if-no-files-found: warn
