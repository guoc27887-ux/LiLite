name: Build iOS 18 IPA (error harvest)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build with iOS 18 target
    runs-on: macos-26
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest stable Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          # Newest stable Xcode 26: the image default is 26.6 (Xcode_26.6.0.app is a
          # symlink to it). Xcode 26.0.1's iOS 26.0 platform component is incomplete on
          # this image ("iOS 26.0 is not installed" for the generic device destination),
          # so do not pin the oldest 26.0.x.
          pick=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          echo "Selected: $pick"
          sudo xcode-select -s "$pick"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $sdk"
          python3 -c "import json,plistlib,sys; s=json.load(open('$sdk/SDKSettings.json')); v=plistlib.load(open('$sdk/System/Library/CoreServices/SystemVersion.plist','rb')); print('SDKSettings Version:', s['Version'], '| ProductVersion:', v['ProductVersion'])"

      - name: Cache native deps (FFmpeg/mpv build trees)
        uses: actions/cache@v4
        with:
          path: ~/.cache/piliplus-native/tools
          key: native-tools-${{ hashFiles('MediaKit/**') }}
          restore-keys: native-tools-

      - name: Install native build tools
        run: |
          brew install meson ninja pkg-config
          python3 -m pip install --break-system-packages jinja2

      - name: Build (log to file)
        run: |
          set -o pipefail
          bash Scripts/build-ios18.sh 2>&1 | tee build-ios18.log

      - name: Upload IPA
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: lilite-ios18-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios18-build-log
          path: build-ios18.log
          if-no-files-found: warn
