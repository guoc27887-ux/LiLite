name: Probe Xcode destinations (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      matrix:
        xcode: [Xcode_26.0.1.app, newest]
    steps:
      - uses: actions/checkout@v4
      - name: Show destinations
        run: |
          if [ "${{ matrix.xcode }}" = "newest" ]; then
            pick=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          else
            pick=/Applications/${{ matrix.xcode }}
          fi
          echo "Selected: $pick"
          sudo xcode-select -s "$pick"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcodebuild -showdestinations -project LiLite.xcodeproj -scheme LiLite 2>&1 | head -60
